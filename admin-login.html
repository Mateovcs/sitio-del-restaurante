<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Restaurante Delicias</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000202;
        }
        .login-box {
            background: #0d0d0d;
            padding: 50px;
            border-radius: 15px;
            border: 2px solid #333;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-box h1 {
            color: #db241b;
            margin-bottom: 30px;
            font-size: 32px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            color: white;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .form-input {
            width: 100%;
            padding: 15px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
            font-size: 16px;
        }
        .form-input:focus {
            border-color: #db241b;
            outline: none;
        }
        .login-btn {
            width: 100%;
            padding: 15px;
            background: #db241b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        .login-btn:hover {
            background: #c41f17;
        }
        .error-message {
            color: #ff4444;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>🔐 Admin Login</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuario:</label>
                    <input type="text" id="username" class="form-input" placeholder="Ingresa tu usuario" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" class="form-input" placeholder="Ingresa tu contraseña" required>
                </div>
                
                <button type="submit" class="login-btn">Ingresar al Panel</button>
                
                <div class="error-message" id="errorMessage">
                    Usuario o contraseña incorrectos
                </div>
            </form>
            
            <div style="margin-top: 30px; color: #A7A7A7; font-size: 14px;">
                <p><strong>Credenciales de prueba:</strong></p>
                <p>Usuario: <strong>admin</strong></p>
                <p>Contraseña: <strong>admin123</strong></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            
            // Credenciales simples (en un sistema real esto estaría en el backend)
            if (username === 'admin' && password === 'admin123') {
                localStorage.setItem('adminLoggedIn', 'true');
                window.location.href = 'admin-panel.html';
            } else {
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
