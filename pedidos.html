<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realizar Pedido - Restaurante Delicias</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .order-container {
            padding: 80px 0;
            color: white;
            min-height: 100vh;
            background: #000202;
        }
        .order-steps {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
            gap: 20px;
        }
        .step {
            text-align: center;
            padding: 15px 25px;
            background: #0d0d0d;
            border-radius: 10px;
            border: 2px solid #333;
        }
        .step.active {
            border-color: #db241b;
            background: #1a1a1a;
        }
        .step-number {
            background: #db241b;
            color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
        }
        .order-section {
            display: none;
            background: #0d0d0d;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #333;
            margin-bottom: 20px;
        }
        .order-section.active {
            display: block;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: white;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .form-input {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: white;
            border-radius: 5px;
        }
        .form-input:focus {
            border-color: #db241b;
            outline: none;
        }
        .btn-order {
            background: #db241b;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 10px 5px;
        }
        .btn-order:hover {
            background: #c41f17;
        }
        .btn-order.secondary {
            background: #333;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #1a1a1a;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .cart-total {
            text-align: right;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #333;
        }
        .message {
            padding: 15px;
            background: #28a745;
            color: white;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="order-container container">
        <div style="text-align: center; margin-bottom: 40px;">
            <h1>🍔 Realizar Pedido</h1>
            <p style="color: #A7A7A7;">Ordena tu comida favorita en 3 simples pasos</p>
        </div>

        <!-- Pasos -->
        <div class="order-steps">
            <div class="step active" id="step1">
                <div class="step-number">1</div>
                <div>Productos</div>
            </div>
            <div class="step" id="step2">
                <div class="step-number">2</div>
                <div>Información</div>
            </div>
            <div class="step" id="step3">
                <div class="step-number">3</div>
                <div>Confirmar</div>
            </div>
        </div>

        <!-- Mensaje -->
        <div class="message" id="successMessage"></div>

        <!-- PASO 1: Seleccionar Productos -->
        <div id="step1-section" class="order-section active">
            <h2>Selecciona tus productos</h2>
            <div id="productsList" class="products-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin: 20px 0;">
                <!-- Los productos se cargarán aquí -->
            </div>
            <div style="text-align: right;">
                <button class="btn-order" onclick="showStep(2)">Continuar →</button>
            </div>
        </div>

        <!-- PASO 2: Información del Cliente -->
        <div id="step2-section" class="order-section">
            <h2>Tu información</h2>
            <form id="customerForm">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label for="customerName">Nombre completo *</label>
                        <input type="text" id="customerName" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label for="customerPhone">Teléfono *</label>
                        <input type="tel" id="customerPhone" class="form-input" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="customerEmail">Email</label>
                    <input type="email" id="customerEmail" class="form-input">
                </div>
                <div class="form-group">
                    <label for="customerAddress">Dirección de entrega</label>
                    <textarea id="customerAddress" class="form-input" rows="3" placeholder="Calle, número, colonia..."></textarea>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <button type="button" class="btn-order secondary" onclick="showStep(1)">← Volver</button>
                    <button type="button" class="btn-order" onclick="showStep(3)">Continuar →</button>
                </div>
            </form>
        </div>

        <!-- PASO 3: Confirmar Pedido -->
        <div id="step3-section" class="order-section">
            <h2>Confirmar Pedido</h2>
            <div id="orderSummary">
                <!-- Resumen del pedido se cargará aquí -->
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 30px;">
                <button class="btn-order secondary" onclick="showStep(2)">← Volver</button>
                <button class="btn-order" onclick="submitOrder()">✅ Confirmar Pedido</button>
            </div>
        </div>
    </div>

    <script>
        let cart = [];
        const API_URL = '/api';

        // Cargar productos
        async function loadProducts() {
            try {
                const response = await fetch(`${API_URL}/products`);
                const products = await response.json();
                const productsList = document.getElementById('productsList');
                
                productsList.innerHTML = '';
                
                products.forEach(product => {
                    const productCard = document.createElement('div');
                    productCard.className = 'product-card';
                    productCard.style.background = '#1a1a1a';
                    productCard.style.padding = '20px';
                    productCard.style.borderRadius = '10px';
                    productCard.style.border = '1px solid #333';
                    productCard.style.cursor = 'pointer';
                    productCard.style.transition = 'all 0.3s ease';
                    
                    productCard.innerHTML = `
                        <h4 style="color: #db241b; margin-bottom: 10px;">${product.name}</h4>
                        <p style="color: #A7A7A7; margin-bottom: 10px;">${product.description}</p>
                        <p style="color: white; font-weight: bold; margin-bottom: 15px;">$${product.price}</p>
                        <button class="btn-order" onclick="addToCart(${product.id}, '${product.name}', ${product.price})" 
                                style="width: 100%; padding: 10px;">
                            ➕ Agregar
                        </button>
                    `;
                    
                    productsList.appendChild(productCard);
                });
            } catch (error) {
                console.error('Error cargando productos:', error);
            }
        }

        // Agregar al carrito
        function addToCart(id, name, price) {
            const existingItem = cart.find(item => item.id === id);
            
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({
                    id: id,
                    name: name,
                    price: price,
                    quantity: 1
                });
            }
            
            updateCartBadge();
            showMessage('✅ Producto agregado al carrito');
        }

        // Actualizar badge del carrito
        function updateCartBadge() {
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            // Podrías mostrar el total en algún lugar de la UI
            console.log(`🛒 Carrito: ${totalItems} productos`);
        }

        // Navegar entre pasos
        function showStep(step) {
            // Ocultar todos los pasos
            document.querySelectorAll('.order-section').forEach(section => {
                section.classList.remove('active');
            });
            
            // Remover active de todos los steps
            document.querySelectorAll('.step').forEach(step => {
                step.classList.remove('active');
            });
            
            // Mostrar paso seleccionado
            document.getElementById(`step${step}-section`).classList.add('active');
            document.getElementById(`step${step}`).classList.add('active');
            
            // Si es el paso 3, actualizar el resumen
            if (step === 3) {
                updateOrderSummary();
            }
        }

        // Actualizar resumen del pedido
        function updateOrderSummary() {
            const orderSummary = document.getElementById('orderSummary');
            let html = '<h3>Resumen de tu pedido:</h3>';
            
            if (cart.length === 0) {
                html += '<p style="color: #A7A7A7; text-align: center;">No hay productos en el carrito</p>';
                orderSummary.innerHTML = html;
                return;
            }
            
            let total = 0;
            
            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                
                html += `
                    <div class="cart-item">
                        <div>
                            <strong>${item.name}</strong><br>
                            <small>Cantidad: ${item.quantity} x $${item.price}</small>
                        </div>
                        <div>$${itemTotal.toFixed(2)}</div>
                    </div>
                `;
            });
            
            html += `
                <div class="cart-total">
                    Total: <span style="color: #db241b;">$${total.toFixed(2)}</span>
                </div>
            `;
            
            orderSummary.innerHTML = html;
        }

        // Enviar pedido
        async function submitOrder() {
            const customerName = document.getElementById('customerName').value;
            const customerPhone = document.getElementById('customerPhone').value;
            const customerEmail = document.getElementById('customerEmail').value;
            
            if (!customerName || !customerPhone) {
                showMessage('❌ Por favor completa todos los campos obligatorios', 'error');
                return;
            }
            
            if (cart.length === 0) {
                showMessage('❌ No hay productos en el carrito', 'error');
                return;
            }
            
            const orderDetails = cart.map(item => 
                `${item.quantity}x ${item.name} - $${item.price} c/u`
            ).join(', ');
            
            const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            const orderData = {
                customer_name: customerName,
                customer_phone: customerPhone,
                customer_email: customerEmail,
                order_details: orderDetails,
                total_amount: totalAmount
            };
            
            try {
                const response = await fetch(`${API_URL}/orders`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(orderData)
                });
                
                if (response.ok) {
                    showMessage('✅ ¡Pedido realizado con éxito! Te contactaremos pronto.');
                    cart = [];
                    updateCartBadge();
                    
                    // Limpiar formulario
                    document.getElementById('customerForm').reset();
                    
                    // Volver al paso 1 después de 3 segundos
                    setTimeout(() => {
                        showStep(1);
                    }, 3000);
                } else {
                    const error = await response.json();
                    showMessage(`❌ Error: ${error.error}`, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('❌ Error al realizar el pedido', 'error');
            }
        }

        // Mostrar mensaje
        function showMessage(message, type = 'success') {
            const messageEl = document.getElementById('successMessage');
            messageEl.textContent = message;
            messageEl.style.display = 'block';
            messageEl.style.background = type === 'success' ? '#28a745' : '#dc3545';
            
            setTimeout(() => {
                messageEl.style.display = 'none';
            }, 5000);
        }

        // Cargar productos al iniciar
        document.addEventListener('DOMContentLoaded', function() {
            loadProducts();
        });
    </script>
</body>
</html>
